name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Create as draft release"
        type: boolean
        default: true

permissions:
  contents: write

env:
  ELIXIR_VERSION: "1.19.5"
  OTP_VERSION: "28.5"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-latest
          - platform: linux-x86_64
            os: ubuntu-24.04
          - platform: windows-x86_64
            os: windows-latest

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwxgtk-webview3.2-dev \
            libwxgtk3.2-dev \
            libglib2.0-dev \
            libssl-dev \
            makeself \
            xz-utils

      - name: Install macOS dependencies
        if: startsWith(matrix.os, 'macos')
        run: brew install wxwidgets

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          choco install nsis
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: elixir-prod-${{ matrix.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            elixir-${{ matrix.os }}-

      - name: Build deps and compile
        env:
          MIX_ENV: prod
          WORTH_DEPS_MODE: prod
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod
          mix assets.deploy
          mix compile --force

      - name: Fix macOS NIF rpaths for desktop_deployment
        if: startsWith(matrix.os, 'macos')
        run: |
          echo "=== All NIF files in _build ==="
          find _build -name "*.so" -o -name "*.dylib" 2>/dev/null

          echo "=== Fixing stale RPATHs ==="
          find _build -name "*.so" -o -name "*.dylib" 2>/dev/null | while read f; do
            case "$f" in
              *_build/prod/rel/*) continue ;;
            esac

            id="$(otool -D "$f" 2>/dev/null | tail -n +2 | head -1)"
            case "$id" in
              /Users/runner/work/*)
                base=$(basename "$id")
                echo "  FIX id($f): $id -> @rpath/$base"
                install_name_tool -id "@rpath/$base" "$f"
                ;;
            esac

            otool -L "$f" 2>/dev/null | tail -n +2 | awk '{print $1}' | while read dep; do
              case "$dep" in
                /Users/runner/work/*)
                  base=$(basename "$dep")
                  echo "  FIX dep($f): $dep -> @rpath/$base"
                  install_name_tool -change "$dep" "@rpath/$base" "$f"
                  ;;
              esac
            done
          done

      - name: Build installer
        env:
          MIX_ENV: prod
          WORTH_DESKTOP: "1"
          WORTH_DEPS_MODE: prod
        run: |
          mix release desktop_installer --overwrite

      - name: Upload macOS installer
        if: startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: worth-${{ matrix.platform }}
          path: |
            _build/prod/Worth-*.dmg
          if-no-files-found: warn

      - name: Upload Linux installer
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: worth-${{ matrix.platform }}
          path: |
            _build/prod/Worth-*.run
          if-no-files-found: warn

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: worth-${{ matrix.platform }}
          path: |
            _build/prod/Worth-*.exe
          if-no-files-found: warn

      - name: Upload OTP release directory (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: worth-${{ matrix.platform }}-release
          path: |
            _build/prod/rel/desktop_installer/
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ inputs.draft || true }}
          generate_release_notes: true
          files: |
            artifacts/Worth-*.dmg
            artifacts/Worth-*.run
            artifacts/Worth-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
